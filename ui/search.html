<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahaja Yoga Video Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #67b7f8;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 20px;
    }

    .top-hero {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
      margin-bottom: 8px;
      color: white;
    }

    .hero-content {
      flex: 1;
      min-width: 0;
      max-width: 860px;
    }

    .header {
      background: #ffcf32;
      margin: 0 calc(50% - 50vw) 10px;
      padding: 6px 20px 5px;
      text-align: center;
      position: relative;
    }

    .header-course-link {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      color: #133b5b;
      font-size: 0.9em;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      opacity: 0.9;
    }

    .header-course-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Full artwork visible: PNG already includes circular portrait + curved name text */
    .header-portrait {
      line-height: 0;
      flex-shrink: 0;
    }

    .header-portrait img {
      display: block;
      width: auto;
      height: auto;
      max-height: 200px;
      max-width: min(240px, 42vw);
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.22));
    }

    .header-text {
      text-align: center;
      min-width: 0;
      padding-top: 0;
    }

    .header-text p {
      color: #ffffff;
      opacity: 0.95;
      font-size: 0.92em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
      margin: 0;
      line-height: 1;
    }

    .header h1 {
      color: #ffffff;
      font-size: 2.1em;
      line-height: 1;
      margin-bottom: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .search-form {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 12px;
    }

    .search-panel {
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .context-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .context-btn {
      padding: 6px 16px;
      font-size: 14px;
      min-width: 170px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white;
      color: #666;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .context-btn:hover {
      border-color: #667eea;
      color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }

    .context-btn.active {
      background: #133b5b;
      color: white;
      border-color: #133b5b;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(19, 59, 91, 0.35);
    }

    .context-btn.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(19, 59, 91, 0.45);
    }

    .search-input-group {
      display: flex;
      gap: 10px;
    }

    .example-prompts {
      margin-top: 14px;
    }

    .example-prompt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-prompt-chip {
      padding: 8px 14px;
      font-size: 13px;
      line-height: 1.3;
      border: 1px solid #d5dde5;
      border-radius: 999px;
      background: #f4f7fa;
      color: #133b5b;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      text-align: left;
      max-width: 100%;
    }

    .example-prompt-chip:hover {
      background: #e8f1f8;
      border-color: #133b5b;
      transform: translateY(-1px);
    }

    .example-prompt-chip:focus {
      outline: 2px solid #133b5b;
      outline-offset: 2px;
    }

    #query {
      flex: 1;
      padding: 15px 20px;
      font-size: 17px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    #query:focus {
      border-color: #667eea;
    }

    #searchBtn {
      padding: 15px 30px;
      font-size: 17px;
      background: #133b5b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #searchBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #searchBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 18px;
      padding: 40px;
      display: none;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #ff6b6b;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .results-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }

    .result-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .result-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* Resource card styles */
    .resource-card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: white;
    }

    .resource-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .topic-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }

    .resource-card-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .resource-description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
      font-size: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tag {
      background: #f0f0f0;
      color: #667eea;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 500;
    }

    .resource-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .file-type-badge {
      background: #4ecdc4;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .download-hint {
      color: #667eea;
      font-size: 12px;
      font-weight: 500;
      margin-top: 10px;
      text-align: center;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 aspect ratio */
      background: #000;
      overflow: hidden;
    }

    .thumbnail-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .play-overlay::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 20px solid #667eea;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }

    .result-card:hover .play-overlay {
      background: rgba(255,255,255,1);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .card-content {
      padding: 20px;
    }

    .video-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .section-title {
      font-size: 16px;
      color: #667eea;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .timestamp {
      display: inline-block;
      background: #f0f0f0;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .summary {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chakra-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .confidence-badge {
      background: #4ecdc4;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .quote {
      background: #fff9e6;
      padding: 12px;
      border-left: 4px solid #ffd93d;
      border-radius: 4px;
      font-style: italic;
      color: #666;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .hashtags {
      color: #667eea;
      font-size: 13px;
    }

    .more-like-this-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0 4px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 10px rgba(102, 126, 234, 0.35);
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: moreLikeIn 0.35s ease-out;
    }

    .more-like-this-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
    }

    @keyframes moreLikeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .related-banner {
      display: none;
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .related-banner.visible {
      display: flex;
    }

    .related-banner-text {
      color: #333;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }

    .related-banner-text span {
      color: #667eea;
      font-weight: 500;
    }

    .back-to-search-btn {
      padding: 10px 16px;
      border: 1px solid #667eea;
      border-radius: 8px;
      background: white;
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }

    .back-to-search-btn:hover {
      background: #667eea;
      color: white;
    }

    .no-results {
      text-align: center;
      color: white;
      font-size: 18px;
      padding: 40px;
      display: none;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      margin: 2% auto;
      width: 90%;
      max-width: 1200px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      animation: slideDown 0.3s;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      background: #1a1a1a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      color: white;
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      line-height: 30px;
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: #ff6b6b;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .results-container {
        grid-template-columns: 1fr;
      }

      .search-input-group {
        flex-direction: column;
      }

      .top-hero {
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .header-portrait img {
        max-height: 130px;
        max-width: min(185px, 55vw);
      }

      .header-text {
        text-align: center;
        padding-top: 0;
      }

      .header h1 {
        font-size: 1.85em;
      }

      .header {
        padding: 28px 16px 8px;
      }

      .header-course-link {
        top: 8px;
        right: 12px;
        transform: none;
        font-size: 0.78em;
      }

      .search-form {
        width: 100%;
        padding: 16px;
      }

      .modal-content {
        width: 95%;
        margin: 5% auto;
      }

      .context-buttons {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .context-btn {
        flex: 1 1 auto;
        min-width: 140px;
        justify-content: center;
      }

      .example-prompt-chip {
        font-size: 12px;
        padding: 7px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a
        class="header-course-link"
        href="https://us.sahajayoga.org/21days/"
        target="_blank"
        rel="noopener noreferrer"
      >About 21-Day Course</a>
      <div class="header-text">
        <h1>Let's Meditate  For 21 Days</h1>
        <p>Search Meditation videos and find handouts</p>
      </div>
    </div>
    <div class="top-hero">
      <div class="header-portrait">
        <img
          src="/ui/Shri-Mataji-round-blue-shadow-white-name.png"
          alt="Shri Mataji"
          loading="eager"
        />
      </div>
      <div class="hero-content">
        <div class="search-panel">
          <div class="search-form">
            <div class="search-input-group">
              <input 
                type="text" 
                id="query" 
                placeholder="Type your query to search meditation videos…" 
                autocomplete="off"
              />
              <button id="searchBtn" onclick="performSearch()">Search</button>
            </div>
            <div class="example-prompts" id="examplePrompts" aria-label="Example searches">
              <div class="example-prompt-chips" id="examplePromptChips"></div>
            </div>
          </div>
          <div class="context-buttons">
            <button class="context-btn active" id="btnVideos" onclick="switchContext('videos')">
              🔍 Videos
            </button>
            <button class="context-btn" id="btnHandouts" onclick="switchContext('resources')">
              📚 Handouts
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="error" id="error"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Searching for relevant videos...</p>
    </div>

    <div class="no-results" id="noResults">
      <p>No results found. Try a different search query.</p>
    </div>

    <div class="related-banner" id="relatedBanner" aria-live="polite">
      <div class="related-banner-text" id="relatedBannerText"></div>
      <button type="button" class="back-to-search-btn" id="backToSearchBtn">
        ← Back to Search Result
      </button>
    </div>

    <div class="results-container" id="results"></div>
  </div>

  <!-- Modal for video embedding -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="video-container" id="videoContainer"></div>
    </div>
  </div>

  <script>
    // Context state management
    let searchMode = 'videos'; // 'videos' or 'resources'
    // Debug fields on video cards (timestamp, confidence, hashtags).
    // Default true until /api/ui-config loads; Cloud Run sets SHOW_RESULT_DEBUG=false.
    // enableMoreLikeThis defaults true until /api/ui-config loads (matches server default).
    let uiConfig = { showResultDebug: true, enableMoreLikeThis: true };

    // More like this state (Phase B)
    let currentVideoResults = [];
    let lastOpenedResult = null;
    let engagedSeed = null;
    let relatedViewActive = false;
    let searchSnapshot = null; // { query, results } for Back

    // API URLs
    const VIDEO_API_URL = '/search';
    const RESOURCE_API_URL = '/api/resources/search';
    const UI_CONFIG_URL = '/api/ui-config';
    const RELATED_API_URL = '/api/videos/related';

    async function loadUiConfig() {
      try {
        const response = await fetch(UI_CONFIG_URL);
        if (!response.ok) return;
        const data = await response.json();
        if (typeof data.showResultDebug === 'boolean') {
          uiConfig.showResultDebug = data.showResultDebug;
        }
        if (typeof data.enableMoreLikeThis === 'boolean') {
          uiConfig.enableMoreLikeThis = data.enableMoreLikeThis;
        }
      } catch (err) {
        console.warn('Could not load UI config; using defaults', err);
      }
    }

    function clearRelatedState() {
      relatedViewActive = false;
      searchSnapshot = null;
      engagedSeed = null;
      lastOpenedResult = null;
      hideRelatedBanner();
    }

    function showRelatedBanner(seed) {
      const banner = document.getElementById('relatedBanner');
      const text = document.getElementById('relatedBannerText');
      const title = (seed && seed.section_title) || 'this clip';
      text.innerHTML = `Showing more like: <span>${escapeHtml(title)}</span>`;
      banner.classList.add('visible');
    }

    function hideRelatedBanner() {
      const banner = document.getElementById('relatedBanner');
      banner.classList.remove('visible');
      document.getElementById('relatedBannerText').textContent = '';
    }

    function seedKey(result) {
      if (!result) return '';
      const vid = result.video_id || extractVideoId(result.url || '');
      return `${vid}|${result.timestamp || ''}`;
    }

    // Placeholders for different contexts
    const PLACEHOLDERS = {
      videos: 'Type your query to search meditation videos…',
      resources: 'Search meditation handouts…'
    };

    // ChatGPT-style starter prompts: click fills the box and searches right away
    const EXAMPLE_PROMPTS = {
      videos: [
        'What is Sahaja Yoga Meditation?',
        'Heart chakra meditation',
        'Experience the silence within',
        "Founder's talk on Innocence",
        'Footsoak with Wendy',
        'Piano music for meditation by Sia'
      ],
      resources: [
        'Beginner meditation handout',
        'Chakra overview',
        'Daily meditation practice guide',
        'Affirmations for meditation',
        'How to raise Kundalini',
        'Online meditation classes'
      ]
    };

    function renderExamplePrompts(mode) {
      const chips = document.getElementById('examplePromptChips');
      if (!chips) return;
      chips.innerHTML = '';
      const prompts = EXAMPLE_PROMPTS[mode] || [];
      prompts.forEach((text) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'example-prompt-chip';
        btn.textContent = text;
        btn.addEventListener('click', () => applyExamplePrompt(text));
        chips.appendChild(btn);
      });
    }

    function applyExamplePrompt(text) {
      const queryInput = document.getElementById('query');
      queryInput.value = text;
      performSearch();
    }

    // Allow Enter key to trigger search
    document.getElementById('query').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        performSearch();
      }
    });

    document.getElementById('backToSearchBtn').addEventListener('click', backToSearch);

    function switchContext(mode) {
      if (mode === searchMode) return; // Already in this mode
      
      searchMode = mode;
      
      // Update button states
      document.getElementById('btnVideos').classList.toggle('active', mode === 'videos');
      document.getElementById('btnHandouts').classList.toggle('active', mode === 'resources');
      
      // Clear search input and update placeholder
      const queryInput = document.getElementById('query');
      queryInput.value = '';
      queryInput.placeholder = PLACEHOLDERS[mode];
      renderExamplePrompts(mode);
      
      // Clear results
      clearRelatedState();
      currentVideoResults = [];
      document.getElementById('results').innerHTML = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('noResults').style.display = 'none';
      
      // Update loading message
      const loadingText = document.querySelector('#loading p');
      if (loadingText) {
        loadingText.textContent = mode === 'videos' 
          ? 'Searching for relevant videos...' 
          : 'Searching resources...';
      }
    }

    renderExamplePrompts(searchMode);
    document.getElementById('query').placeholder = PLACEHOLDERS[searchMode];
    loadUiConfig();

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    /**
     * POST/GET JSON. On HTTP 5xx or network failure, retry once after a short
     * delay to ride out transient Chroma / GCS FUSE disk I/O blips.
     */
    async function fetchJsonWithRetry(url, options, { retries = 1, retryDelayMs = 350 } = {}) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt++) {
        let response;
        try {
          response = await fetch(url, options);
        } catch (err) {
          lastError = err;
          if (attempt < retries) {
            console.warn(`Network error for ${url}; retrying…`, err);
            await sleep(retryDelayMs);
            continue;
          }
          throw err;
        }

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        if (response.ok) {
          return { response, data };
        }

        const errMsg = data.error || data.message || `Request failed (${response.status})`;
        lastError = new Error(errMsg);
        if (response.status >= 500 && attempt < retries) {
          console.warn(`Request ${response.status} from ${url}; retrying…`, data);
          await sleep(retryDelayMs);
          continue;
        }
        throw lastError;
      }
      throw lastError || new Error('Request failed');
    }

    async function performSearch() {
      const query = document.getElementById('query').value.trim();
      const resultsContainer = document.getElementById('results');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const noResults = document.getElementById('noResults');
      const searchBtn = document.getElementById('searchBtn');

      // Clear previous results / related view
      clearRelatedState();
      currentVideoResults = [];
      resultsContainer.innerHTML = '';
      error.style.display = 'none';
      noResults.style.display = 'none';
      noResults.querySelector('p').textContent =
        'No results found. Try a different search query.';

      if (!query) {
        showError('Please enter a search query');
        return;
      }

      // Show loading state
      loading.style.display = 'block';
      const loadingText = document.querySelector('#loading p');
      if (loadingText) {
        loadingText.textContent = searchMode === 'videos'
          ? 'Searching for relevant videos...'
          : 'Searching resources...';
      }
      searchBtn.disabled = true;

      try {
        const apiUrl = searchMode === 'videos' ? VIDEO_API_URL : RESOURCE_API_URL;
        const { data } = await fetchJsonWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, top_k: 5 }),
        });

        loading.style.display = 'none';
        searchBtn.disabled = false;

        if (data.results && data.results.length > 0) {
          displayResults(data.results, searchMode);
        } else {
          noResults.style.display = 'block';
        }
      } catch (err) {
        loading.style.display = 'none';
        searchBtn.disabled = false;
        showError(err.message || 'Failed to search. Make sure the API server is running on port 5005.');
        console.error('Search error:', err);
      }
    }

    function displayResults(results, mode) {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';

      const ordered = [...results].sort(
        (a, b) => (b.confidence || 0) - (a.confidence || 0)
      );

      if (mode === 'videos') {
        currentVideoResults = ordered;
      }

      ordered.forEach((result, index) => {
        const card = mode === 'videos' 
          ? createVideoCard(result, index)
          : createResourceCard(result);
        resultsContainer.appendChild(card);
      });
    }

    function createVideoCard(result, index) {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.onclick = () => openVideoModal(result);

      // Extract video ID from URL
      const videoId = result.video_id || extractVideoId(result.url);
      const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;

      const showMoreBtn = uiConfig.enableMoreLikeThis &&
        engagedSeed &&
        seedKey(engagedSeed) === seedKey(result);

      card.innerHTML = `
        <div class="thumbnail-container">
          <img src="${thumbnailUrl}" alt="${result.video_title}" 
               onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">
          <div class="play-overlay"></div>
        </div>
        <div class="card-content">
          <div class="video-title">${escapeHtml(result.video_title)}</div>
          <div class="section-title">${escapeHtml(result.section_title)}</div>
          ${showMoreBtn
            ? `<button type="button" class="more-like-this-btn" data-more-like="1">Find similar clips</button>`
            : ''}
          ${uiConfig.showResultDebug
            ? `<div class="timestamp">⏱️ ${result.timestamp || 'N/A'}</div>`
            : ''}
          <div class="summary">${escapeHtml(result.summary || 'No summary available')}</div>
          <div class="metadata">
            ${result.chakra ? `<span class="chakra-badge">${escapeHtml(result.chakra)}</span>` : ''}
            ${uiConfig.showResultDebug && result.confidence
              ? `<span class="confidence-badge">Confidence: ${(result.confidence * 100).toFixed(1)}%</span>`
              : ''}
          </div>
          ${result.quote ? `<div class="quote">"${escapeHtml(result.quote)}"</div>` : ''}
          ${uiConfig.showResultDebug && result.hashtags
            ? `<div class="hashtags">${escapeHtml(result.hashtags)}</div>`
            : ''}
        </div>
      `;

      const moreBtn = card.querySelector('[data-more-like]');
      if (moreBtn) {
        moreBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          fetchMoreLikeThis(result);
        });
      }

      return card;
    }

    function createResourceCard(result) {
      const card = document.createElement('div');
      card.className = 'result-card';
      
      // Make card clickable - opens download URL in new tab
      card.addEventListener('click', function() {
        if (result.download_url) {
          window.open(result.download_url, '_blank');
        }
      });

      // Format tags - handle both array and string formats
      let tagsArray = [];
      if (result.tags) {
        if (Array.isArray(result.tags)) {
          tagsArray = result.tags;
        } else if (typeof result.tags === 'string') {
          tagsArray = result.tags.split(',').map(t => t.trim()).filter(t => t);
        }
      }
      const tagsHtml = tagsArray.length > 0
        ? tagsArray.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')
        : '';

      // Format description (truncate if too long)
      const description = result.description || 'No description available';
      const truncatedDesc = description.length > 150 
        ? description.substring(0, 150) + '...' 
        : description;

      card.innerHTML = `
        <div class="resource-card-header">
          <div class="resource-title">${escapeHtml(result.title)}</div>
          <span class="topic-badge">${escapeHtml(result.topic || 'General')}</span>
        </div>
        <div class="resource-card-content">
          <div class="resource-description">${escapeHtml(truncatedDesc)}</div>
          ${tagsHtml ? `<div class="tags-container">${tagsHtml}</div>` : ''}
          <div class="download-hint">Click to download →</div>
        </div>
        <div class="resource-card-footer">
          ${uiConfig.showResultDebug
            ? `<span class="file-type-badge">${escapeHtml(result.file_type || 'file').toUpperCase()}</span>`
            : ''}
          ${uiConfig.showResultDebug && result.confidence != null
            ? `<span class="confidence-badge">${(result.confidence * 100).toFixed(0)}% match</span>`
            : ''}
        </div>
      `;

      return card;
    }

    function extractVideoId(url) {
      // Extract YouTube video ID from various URL formats
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
        /youtube\.com\/.*[?&]v=([^&\n?#]+)/
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) {
          return match[1];
        }
      }
      return '';
    }

    function convertTimestampToSeconds(timestamp) {
      if (!timestamp) return 0;
      
      // Handle formats: "MM:SS" or "HH:MM:SS"
      const parts = timestamp.split(':').map(Number);
      
      if (parts.length === 2) {
        // MM:SS format
        return parts[0] * 60 + parts[1];
      } else if (parts.length === 3) {
        // HH:MM:SS format
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }
      
      return 0;
    }

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
    }

    function openVideoModal(result) {
      const videoId = result.video_id || extractVideoId(result.url);
      const timestampSeconds = convertTimestampToSeconds(result.timestamp);

      // Soft cutover: with feature off, keep prior mobile behavior (open YouTube app/tab).
      // With feature on, always use in-modal iframe so related exploration stays on-page.
      if (isMobileDevice() && !uiConfig.enableMoreLikeThis) {
        const watchUrl = `https://www.youtube.com/watch?v=${videoId}&t=${timestampSeconds}s`;
        window.open(watchUrl, '_blank', 'noopener,noreferrer');
        return;
      }

      lastOpenedResult = result;

      const modal = document.getElementById('videoModal');
      const modalTitle = document.getElementById('modalTitle');
      const videoContainer = document.getElementById('videoContainer');

      // Desktop: autoplay OK. Mobile: no autoplay — user taps Play in the iframe.
      const autoplay = isMobileDevice() ? 0 : 1;
      const embedUrl =
        `https://www.youtube.com/embed/${videoId}` +
        `?start=${timestampSeconds}&autoplay=${autoplay}&playsinline=1&rel=0`;

      modalTitle.textContent = `${result.video_title} - ${result.section_title}`;
      videoContainer.innerHTML =
        `<iframe src="${embedUrl}" frameborder="0" ` +
        `allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ` +
        `allowfullscreen playsinline></iframe>`;

      modal.style.display = 'block';
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const videoContainer = document.getElementById('videoContainer');
      
      modal.style.display = 'none';
      videoContainer.innerHTML = ''; // Stop video playback
      document.body.style.overflow = 'auto'; // Restore scrolling

      if (uiConfig.enableMoreLikeThis && lastOpenedResult && searchMode === 'videos') {
        engagedSeed = lastOpenedResult;
        lastOpenedResult = null;
        if (currentVideoResults.length > 0) {
          displayResults(currentVideoResults, 'videos');
        }
      } else {
        lastOpenedResult = null;
      }
    }

    async function fetchMoreLikeThis(seed) {
      if (!uiConfig.enableMoreLikeThis || !seed) return;

      const videoId = seed.video_id || extractVideoId(seed.url || '');
      const timestamp = seed.timestamp;
      if (!seed.chroma_id && (!videoId || !timestamp)) {
        showError('Cannot find related clips for this result (missing video id or timestamp).');
        return;
      }

      // Preserve original search once when first entering related view
      if (!relatedViewActive) {
        searchSnapshot = {
          query: document.getElementById('query').value,
          results: [...currentVideoResults],
        };
      }

      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const noResults = document.getElementById('noResults');
      const searchBtn = document.getElementById('searchBtn');

      error.style.display = 'none';
      noResults.style.display = 'none';
      loading.style.display = 'block';
      const loadingText = document.querySelector('#loading p');
      if (loadingText) {
        loadingText.textContent = 'Finding similar clips...';
      }
      searchBtn.disabled = true;

      const body = seed.chroma_id
        ? { id: seed.chroma_id, top_k: 5 }
        : { video_id: videoId, timestamp: timestamp, top_k: 5 };

      try {
        const { data } = await fetchJsonWithRetry(RELATED_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        loading.style.display = 'none';
        searchBtn.disabled = false;

        relatedViewActive = true;
        engagedSeed = null;
        showRelatedBanner(data.seed || seed);

        if (data.results && data.results.length > 0) {
          displayResults(data.results, 'videos');
        } else {
          currentVideoResults = [];
          document.getElementById('results').innerHTML = '';
          noResults.style.display = 'block';
          noResults.querySelector('p').textContent = 'No similar segments found.';
        }
      } catch (err) {
        loading.style.display = 'none';
        searchBtn.disabled = false;
        showError(err.message || 'Failed to load related clips.');
        console.error('Related error:', err);
      }
    }

    function backToSearch() {
      if (!searchSnapshot) {
        clearRelatedState();
        return;
      }

      const snapshot = searchSnapshot;
      relatedViewActive = false;
      searchSnapshot = null;
      engagedSeed = null;
      lastOpenedResult = null;
      hideRelatedBanner();

      document.getElementById('query').value = snapshot.query;
      document.getElementById('error').style.display = 'none';
      document.getElementById('noResults').style.display = 'none';
      // Restore default empty-state copy
      document.querySelector('#noResults p').textContent =
        'No results found. Try a different search query.';

      if (snapshot.results && snapshot.results.length > 0) {
        displayResults(snapshot.results, 'videos');
      } else {
        currentVideoResults = [];
        document.getElementById('results').innerHTML = '';
      }
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('videoModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // Close modal with Escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });

    function showError(message) {
      const error = document.getElementById('error');
      error.textContent = message;
      error.style.display = 'block';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
